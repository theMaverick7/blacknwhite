services:
  app:
    image: node:24-alpine
    command: sh -c "npm install && npx sequelize-cli db:migrate && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 0.0.0.0:4000:8080
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      DB_USERNAME: postgres
      DB_PSWD: admin
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: blacknwhite
      DB_POOL_MAX: 20
      DB_IDLE_TIMEOUT: 30000
      DB_CONNECTION_TIMEOUT: 2000
      DB_POOL_LIFETIME: 60
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 8080

  postgres:
    image: postgres:18.4-alpine
    volumes:
      - blacknwhite-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: blacknwhite
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blacknwhite || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 3

  textract:
    build:
      context: ./src/services/textract
      dockerfile: Dockerfile
    volumes:
      - ./src/services/textract:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      PORT: 4001

volumes:
  blacknwhite-data:
